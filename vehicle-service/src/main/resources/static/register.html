<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Risalat Motors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Premium Fullscreen Gradient matching Login */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 0; /* Thoda padding taaki mobile me scroll ho sake */
        }

        /* Back to Home Link */
        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            z-index: 100;
        }
        .back-link:hover {
            color: #f6c23e;
            transform: translateX(-5px);
        }

        /* Register Card */
        .register-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.3s;
            margin: 0 15px;
        }
        .register-card:hover {
            transform: translateY(-5px);
        }

        /* Card Header */
        .register-header {
            text-align: center;
            padding: 40px 30px 20px;
        }
        .brand-logo {
            color: #1e3c72;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .brand-logo i {
            color: #f6c23e;
        }

        /* Form Inputs */
        .register-body {
            padding: 10px 40px 40px;
        }
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }
        .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #a5a8b9;
            z-index: 10;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px 12px 45px;
            border: 1px solid #e3e6f0;
            background-color: #f8f9fc;
            font-size: 0.95rem;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(30, 60, 114, 0.1);
            border-color: #1e3c72;
            background-color: #fff;
        }

        /* Custom Button */
        .btn-custom-primary {
            background-color: #f6c23e;
            color: #1e3c72;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px;
            border: none;
            transition: all 0.3s;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(246, 194, 62, 0.3);
            margin-top: 10px;
        }
        .btn-custom-primary:hover {
            background-color: #dfad30;
            transform: translateY(-2px);
        }

        /* Alert Styling */
        #message .alert {
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-link d-none d-md-block"><i class="fas fa-arrow-left me-2"></i>Back to Home</a>

<div class="register-card">
    <div class="register-header">
        <div class="brand-logo"><i class="fas fa-car-side me-2"></i>Risalat Motors</div>
        <p class="text-muted small">Join us today! Create your customer account.</p>
    </div>

    <div class="register-body">
        <form id="registerForm">
            <div class="input-group-custom">
                <i class="fas fa-user input-icon"></i>
                <input type="text" id="name" class="form-control" placeholder="Full Name" required>
            </div>

            <div class="input-group-custom">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="input-group-custom">
                <i class="fas fa-phone-alt input-icon"></i>
                <input type="text" id="phone" class="form-control" placeholder="Phone Number" required>
            </div>

            <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" class="form-control" placeholder="Create Password" required>
            </div>

            <button type="submit" class="btn btn-custom-primary">
                Create Account <i class="fas fa-user-plus ms-1"></i>
            </button>
        </form>

        <div id="message"></div>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
        </div>
    </div>
</div>

<script>
    document.getElementById("registerForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const btn = this.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;

        // Button loading state
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Creating...';
        btn.disabled = true;

        const user = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            password: document.getElementById("password").value,
            role: "CUSTOMER" // Backend ko batane ke liye ki naya banda customer hai
        };

        try {
            const response = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            });

            if (response.ok) {
                // Success UI
                document.getElementById("message").innerHTML =
                    `<div class="alert alert-success shadow-sm" role="alert">
                        <i class="fas fa-check-circle me-2"></i> Registration successful! Redirecting to Login...
                    </div>`;

                // Clear form
                this.reset();

                // 1.5 second baad login page pe bhej do
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } else {
                // Professional Error
                document.getElementById("message").innerHTML =
                    `<div class="alert alert-danger shadow-sm" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i> Registration failed. Email might already exist.
                    </div>`;
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            document.getElementById("message").innerHTML =
                `<div class="alert alert-warning shadow-sm" role="alert">
                    <i class="fas fa-server me-2"></i> Server error. Please try again later.
                </div>`;
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
