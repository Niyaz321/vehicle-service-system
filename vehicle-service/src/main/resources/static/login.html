<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Risalat Motors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Premium Fullscreen Gradient */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Back to Home Link */
        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        .back-link:hover {
            color: #f6c23e;
            transform: translateX(-5px);
        }

        /* Login Card */
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.3s;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }

        /* Card Header */
        .login-header {
            text-align: center;
            padding: 40px 30px 20px;
        }
        .brand-logo {
            color: #1e3c72;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .brand-logo i {
            color: #f6c23e;
        }

        /* Form Inputs */
        .login-body {
            padding: 20px 40px 40px;
        }
        .input-group-custom {
            position: relative;
            margin-bottom: 25px;
        }
        .input-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            color: #a5a8b9;
            z-index: 10;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px 12px 45px;
            border: 1px solid #e3e6f0;
            background-color: #f8f9fc;
            font-size: 0.95rem;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(30, 60, 114, 0.1);
            border-color: #1e3c72;
            background-color: #fff;
        }

        /* Custom Button */
        .btn-custom-primary {
            background-color: #f6c23e;
            color: #1e3c72;
            font-weight: 700;
            border-radius: 10px;
            padding: 12px;
            border: none;
            transition: all 0.3s;
            width: 100%;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(246, 194, 62, 0.3);
        }
        .btn-custom-primary:hover {
            background-color: #dfad30;
            transform: translateY(-2px);
        }

        /* Alert Styling */
        #message .alert {
            border-radius: 10px;
            font-size: 0.9rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-link"><i class="fas fa-arrow-left me-2"></i>Back to Home</a>

<div class="login-card">
    <div class="login-header">
        <div class="brand-logo"><i class="fas fa-car-side me-2"></i>Risalat Motors</div>
        <p class="text-muted small">Welcome back! Please login to your account.</p>
    </div>

    <div class="login-body">
        <form id="loginForm">
            <div class="input-group-custom">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="email" class="form-control" placeholder="Email Address" required>
            </div>

            <div class="input-group-custom">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="password" class="form-control" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-custom-primary mt-2">
                Sign In <i class="fas fa-sign-in-alt ms-1"></i>
            </button>
        </form>

        <div id="message"></div>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="small text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary fw-bold text-decoration-none">Create one</a></p>
        </div>
    </div>
</div>

<script>
    document.getElementById("loginForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const btn = this.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;

        // Button loading state
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Authenticating...';
        btn.disabled = true;

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            if (response.ok) {
                const data = await response.json();

                // Professional Success Alert
                document.getElementById("message").innerHTML =
                    `<div class="alert alert-success shadow-sm" role="alert">
                        <i class="fas fa-check-circle me-2"></i> Login successful! Redirecting...
                    </div>`;

                localStorage.setItem("user", JSON.stringify(data));

                // Smooth Redirect
                setTimeout(() => {
                    if(data.role === 'ADMIN') {
                        window.location.href = "admin_dashboard.html";
                    } else {
                        window.location.href = "customer_dashboard.html";
                    }
                }, 1200);

            } else {
                // Professional Error Alert
                document.getElementById("message").innerHTML =
                    `<div class="alert alert-danger shadow-sm" role="alert">
                        <i class="fas fa-exclamation-circle me-2"></i> Invalid email or password!
                    </div>`;
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        } catch (error) {
            document.getElementById("message").innerHTML =
                `<div class="alert alert-warning shadow-sm" role="alert">
                    <i class="fas fa-server me-2"></i> Server error. Please try again later.
                </div>`;
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
