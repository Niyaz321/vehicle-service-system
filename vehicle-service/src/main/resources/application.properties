spring.application.name=VehicleServiceBooking

# Server Port (Railway ke dynamic port ke liye, local par default 8080 rahega)
server.port=${PORT:8080}

# Database Connection (Railway ke variables uthayega, agar nahi mile to fallback local values par chalega)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:vehicle_service_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:admin}

# Hibernate Settings (Tables automatic update karne ke liye)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
